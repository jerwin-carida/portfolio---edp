name: Deploy to x10hosting

on:
  push:
    branches:
      - main  # Change to 'master' if that is your main branch

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      # OPTIONAL: If using React, Vite, or a build step, uncomment the lines below:
      # - name: Install Dependencies & Build
      #   run: |
      #     npm install
      #     npm run build

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.X10_FTP_SERVER }}
          username: ${{ secrets.X10_FTP_USERNAME }}
          password: ${{ secrets.X10_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # If you have a build folder (like 'dist' or 'build'), set local-dir to './dist/'
          local-dir: ./
          
